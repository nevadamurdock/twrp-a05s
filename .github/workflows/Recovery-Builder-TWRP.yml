name: Recovery Builder - TWRP (Samsung A05s)

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP Manifest URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/nevadamurdock/twrp-a05s'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/samsung/a05s'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'a05s'
      MAKEFILE_NAME:
        description: 'Target Makefile Name'
        required: true
        default: 'twrp_a05s'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clean Up Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true

      - name: Initialize Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python3 tar

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize TWRP Source
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.name "nevadamurdock"
          git config --global user.email "nevadamurdock@github.com"
          repo init -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1

      - name: Sync Source Code
        run: |
          cd workspace
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

      - name: Clone Device Tree
        run: |
          cd workspace
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

      - name: Building Recovery Target
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-userdebug || lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
          make recoveryimage bootimage -j$(nproc --all) || make recoveryimage -j$(nproc --all)

      - name: Package for Samsung Odin (Make .tar)
        run: |
          cd workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}
          echo "=== Checking Output Directory ==="
          ls -la
          
          # Jika recovery.img belum dikemas otomatis oleh build system, kemas ramdisk recovery secara manual
          if [ ! -f "recovery.img" ] && [ -d "recovery/root" ]; then
            echo "Creating recovery.img from compiled ramdisk..."
            mkdir -p ramdisk_tmp
            cd recovery/root && find . | cpio -o -H newc | gzip -9 > ../../ramdisk_tmp/ramdisk-recovery.img
            cd ../..
            
            if [ -f "boot.img" ]; then
              cp boot.img recovery.img
            elif [ -f "../../../host/linux-x86/bin/mkbootimg" ]; then
              ../../../host/linux-x86/bin/mkbootimg \
                --kernel ../../../device/samsung/a05s/prebuilt/kernel \
                --ramdisk ramdisk_tmp/ramdisk-recovery.img \
                --cmdline "video=vfb:640x400,bpp=32,memsize=3072000 firmware_class.path=/vendor/firmware,/vendor/firmware_mnt/image console=ttyMSM0,115200n8 androidboot.hardware=qcom service_notifier.ready=1 androidboot.memcg=1" \
                --base 0x00000000 \
                --pagesize 4096 \
                --ramdisk_offset 0x02000000 \
                --tags_offset 0x01e00000 \
                --header_version 2 \
                --dtb ../../../device/samsung/a05s/prebuilt/dtb.img \
                -o recovery.img
            fi
          fi

          if [ -f "recovery.img" ]; then
            tar -cvf recovery.tar recovery.img
            echo "SUCCESS=true" >> $GITHUB_ENV
          else
            echo "Failed to generate recovery.img"
            exit 1
          fi

      - name: Upload Recovery Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_Recovery_${{ github.event.inputs.DEVICE_NAME }}
          path: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/recovery.tar
